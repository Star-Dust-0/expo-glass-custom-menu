plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.glassmenuandroid'
version = '0.1.0'

android {
  namespace "expo.modules.glassmenuandroid"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.customview:customview:1.1.0'
}
