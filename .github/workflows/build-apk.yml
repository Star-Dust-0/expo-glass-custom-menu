name: Build APK

on:
  workflow_dispatch:
    inputs:
      screenshots:
        description: Also run an emulator and capture screenshots
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Generate native project
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK (arm64, debug-signed)
        working-directory: android
        run: |
          for i in 1 2 3 4; do
            ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon -x lint && exit 0
            echo "Build attempt $i failed, retrying (dependency download errors are often transient)"
            sleep 20
          done
          exit 1
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Glass-Menu-Demo
          path: android/app/build/outputs/apk/release/*.apk

  screenshots:
    if: ${{ inputs.screenshots }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Generate native project
        run: npx expo prebuild --platform android --no-install
      - name: Build x86_64 APK for the emulator
        working-directory: android
        run: |
          for i in 1 2 3 4; do
            ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon -x lint && exit 0
            sleep 20
          done
          exit 1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash scripts/ci-screenshots.sh android/app/build/outputs/apk/release/app-release.apk shots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
